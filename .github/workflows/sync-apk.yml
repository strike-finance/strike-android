# Mirrors the APK Google Play serves for the live production release into a
# GitHub release, so .../releases/latest/download/strike.apk is always current.
name: Sync APK from Google Play

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      rehearse:
        description: Download and verify the live version even if it is already released, without publishing
        type: boolean
        default: false

permissions:
  contents: write # create releases
  actions: write # keep the schedule enabled

concurrency:
  group: sync-apk
  cancel-in-progress: false

env:
  PACKAGE_NAME: org.strikefinance.app
  # Play app signing certificate of the universal APK Play generates for us.
  SIGNING_CERT_SHA256: 1cbf83a9b6a2baa5cb9a319575ae3056b00c95f1e246662c7d7964401113a247
  # Every signer in the APK must be one of Play's app signing keys: the original
  # key, the upgraded classical key and the post-quantum key (all in assetlinks.json).
  PLAY_SIGNING_CERTS: >-
    1cbf83a9b6a2baa5cb9a319575ae3056b00c95f1e246662c7d7964401113a247
    3a3699d23e130ca533dac7e28119583650280136c812ee65024e532300ffd62d
    f1dcbc0161eeb1128892cc1b3f046f99dbe1eb8e1c51e15171d5f9533498bc28
  GH_TOKEN: ${{ github.token }}

defaults:
  run:
    shell: bash # adds pipefail, so a failing command in a pipe fails the step

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The Play key lives in this environment, which only main can use. A
    # workflow pushed on any other branch can't read it.
    environment:
      name: play
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find the live production version
        id: play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/play_apk.py latest >> "$GITHUB_OUTPUT"

      - name: Skip if that version is already released
        id: known
        run: |
          code='${{ steps.play.outputs.version_code }}'
          if [ '${{ inputs.rehearse }}' = 'true' ]; then
            echo "Rehearsal: downloading and verifying version code ${code}; nothing will be published"
            echo "released=false" >> "$GITHUB_OUTPUT"
          elif gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' | grep -qx "v[^-]*-${code}"; then
            echo "Version code ${code} is already released"
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the Play-signed universal APK
        if: steps.known.outputs.released == 'false'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/play_apk.py download '${{ steps.play.outputs.version_code }}' strike.apk

      - name: Verify package, version and signature
        if: steps.known.outputs.released == 'false'
        id: apk
        run: |
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          # The upgraded Play key adds an ML-DSA (post-quantum) signer, which
          # apksigner can only read on Java 24 or newer.
          export JAVA_HOME="$JAVA_HOME_25_X64" PATH="$JAVA_HOME_25_X64/bin:$PATH"
          badging=$("$bt/aapt2" dump badging strike.apk | head -1)
          echo "$badging"
          package=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<< "$badging")
          code=$(sed -n "s/.* versionCode='\([^']*\)'.*/\1/p" <<< "$badging")
          name=$(sed -n "s/.* versionName='\([^']*\)'.*/\1/p" <<< "$badging")
          [ "$package" = "$PACKAGE_NAME" ] || { echo "::error::package is $package"; exit 1; }
          [ "$code" = '${{ steps.play.outputs.version_code }}' ] || { echo "::error::versionCode is $code"; exit 1; }
          "$bt/apksigner" verify --print-certs strike.apk | tee certs.txt
          signers=$(grep -v '^Source Stamp' certs.txt | sed -n 's/.*certificate SHA-256 digest: \([0-9a-f]*\).*/\1/p' | sort -u)
          [ -n "$signers" ] || { echo "::error::apksigner printed no signing certificates"; exit 1; }
          for cert in $signers; do
            case " $PLAY_SIGNING_CERTS " in
              *" $cert "*) echo "ok: signed with Play key $cert" ;;
              *) echo "::error::APK has a signer that isn't a Play app signing key: $cert"; exit 1 ;;
            esac
          done
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum strike.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        if: steps.known.outputs.released == 'false' && inputs.rehearse != true
        run: |
          gh release create "v${{ steps.apk.outputs.name }}-${{ steps.apk.outputs.code }}" strike.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Strike ${{ steps.apk.outputs.name }} (${{ steps.apk.outputs.code }})" \
            --latest \
            --notes "The same build that is live on Google Play, as a single APK for phones without Google Play.

          - Version ${{ steps.apk.outputs.name }}, version code ${{ steps.apk.outputs.code }}
          - Signing certificate SHA-256: \`${SIGNING_CERT_SHA256}\`
          - File SHA-256: \`${{ steps.apk.outputs.sha256 }}\`"

      # GitHub turns off schedules in public repos after 60 days without
      # activity; re-enabling from the workflow itself resets that timer.
      - name: Keep the schedule enabled
        if: always()
        run: gh workflow enable sync-apk.yml --repo "$GITHUB_REPOSITORY"
